<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="../Assets/CSS/style.css">
    <style>
        /* Estilos de la página */
        body {
            font-family: Arial, sans-serif;
            background: url(../img/FondoSimple.png) no-repeat;
            background-size: cover;
            background-position: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: #fff;
            padding: 10px 20px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .logo {
            font-size: 24px;
            color: #333;
            text-decoration: none;
        }
        .logo span {
            color: #c7a16e;
        }
        .navbar {
            display: flex;
        }
        .navbar a {
            text-decoration: none;
            color: #333;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .navbar a:hover {
            background-color: #c7a16e;
            color: #fff;
        }
        .container {
            background-color: #fff;
            padding: 30px; /* Incrementar padding */
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 70%; /* Reducir el ancho para centrar mejor */
            margin: 50px auto; /* Centramos horizontal y verticalmente */
        }
        .back-button {
            background-color: #c7a16e;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            text-align: center;
        }
        .back-button:hover {
            background-color: #a57e4e;
        }
        table {
            width: 100%; /* Cambiar a 100% para ocupar todo el ancho del contenedor */
            border-collapse: collapse;
        }
        th, td {
            padding: 15px; /* Aumentamos el padding para hacer la tabla más grande */
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f4f4f4;
        }
        tr:hover {
            background-color: #f9f9f9;
        }
        .edit, .delete {
            background-color: #c7a16e;
            color: #fff;
            border: none;
            padding: 8px 15px; /* Hacer los botones un poco más grandes */
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
            display: inline-block; /* Asegura que los botones estén en línea */
        }
        .edit:hover, .delete:hover {
            background-color: #a57e4e;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
    
            align-items: center; /* Centrar verticalmente */
            justify-content: center; /* Centrar horizontalmente */
        }
        .modal-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 500px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }
        .modal-content h2 {
            margin-top: 0;
        }
        .modal-content .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .modal-content .close:hover,
        .modal-content .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        form label {
            display: block;
            margin-bottom: 10px;
        }
        form input, form textarea {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        form textarea {
            resize: vertical;
            height: 100px;
        }
        form button {
            background-color: #c7a16e;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
            display: inline-block; /* Asegura que los botones estén en línea */
        }
        form button:last-child {
            margin-right: 0; /* Elimina el margen derecho del último botón */
        }
        form button:hover {
            background-color: #a57e4e;
        }
    </style>
</head>
<body>
    <!-- header start -->
    <header>
        <input type="checkbox" name="" id="toggler">
        <label for="toggler" class="fas fa-bars"></label>
        <a href="#" class="logo">Inventario<span>.</span></a>
        <nav class="navbar">
            <a href="./Agregar_producto.html">Agregar Producto</a>
        </nav>
    </header>
    <!-- header ends -->

    <!-- products start -->
    <section class="products" id="products">
        <div class="container">
            <a href="./homeA.html" class="back-button">Volver</a>
            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Descripcion</th>
                        <th>Marca</th>
                        <th>Precio</th>
                        <th>Cantidad</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="productTable">
                    <!-- Aquí se insertarán dinámicamente los productos -->
                </tbody>
            </table>
        </div>
    </section>
    <!-- products ends -->

    <!-- Modal para editar producto -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Editar Producto</h2>
            <form id="editForm">
                <label for="editNombre">Nombre del producto:</label>
                <input type="text" id="editNombre" name="Nombre" required><br>
                <label for="editDescripcion">Descripción del producto:</label>
                <textarea id="editDescripcion" name="Descripcion" required></textarea><br>
                <label for="editMarca">Marca del producto:</label>
                <input type="text" id="editMarca" name="Marca" required><br>
                <label for="editPrecio">Precio del producto:</label>
                <input type="number" id="editPrecio" name="Precio" required><br>
                <label for="editStock">Stock del producto:</label>
                <input type="number" id="editStock" name="Stock" required><br>
                <label for="editMinimoStock">Stock mínimo del producto:</label>
                <input type="number" id="editMinimoStock" name="MinimoStock" required><br>
                <button type="button" id="saveButton">Guardar</button>
                <button type="button" id="cancelButton">Cancelar</button>
            </form>
        </div>
    </div>
    <script src="./Inventario_ajax.js"> </script>
    
</body>
</html>

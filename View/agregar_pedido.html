<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador</title>

    <!-- font awesome cdn link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <!-- custom css file link -->
    <link rel="stylesheet" href="../Assets/CSS/style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: url(../img/FondoSimple.png) no-repeat;
            background-size: cover;
            background-position: center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 90%;
            height: 90%;
        }

        form {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        label {
            margin-bottom: 10px;
        }

        input[type="text"] {
            padding: 10px;
            border: none;
            border-radius: 5px;
            width: 100%;
        }

        button[type="submit"] {
            background-color: #c7a16e;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        button[type="submit"]:hover {
            background-color: #b5895a;
        }
    </style>
</head>
<body>
   
   <!-- header start -->


   <header>
   
    <a href="#" class="logo">Agregar Pedido<span>.</span></a>


    <nav class="navbar">
        <a href="./Pedido.html">Volver</a>    
    </nav>    
   
   </header>
   <!-- header ends -->

   

   <!-- home start -->
    <div class="container">
        <form>
            <label for="pedido">Ingresa tu pedido:</label>
            <input type="text" id="pedido" name="pedido">
            <button type="submit">Agregar Pedido</button>
        </form>
    </div>

   <!-- foother ends -->


</body>
</html>

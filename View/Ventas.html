<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas</title>

    <!-- font awesome cdn link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <!-- custom css file link -->
    <link rel="stylesheet" href="../Assets/CSS/style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: url(../img/FondoSimple.png) no-repeat;
            background-size: cover;
            background-position: center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            width: 100%;
            max-width: 1200px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 50px; /* Ajusta el margen superior para bajar el contenedor */
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }

        th {
            background-color: #c7a16e; /* Cambia el color de fondo de los encabezados de la tabla */
            color: #fff;
        }

        td {
            background-color: #f9f9f9;
        }

        button {
            background-color: #c7a16e; /* Color de fondo del botón */
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
        }

        button:hover {
            background-color: #b5895a; /* Color de fondo del botón al pasar el ratón */
        }

        .search-bar {
            width: 100%;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        .search-bar input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px 0 0 5px;
        }

        .search-bar button {
            width: 50px;
            padding: 10px;
            border: 1px solid #ddd;
            border-left: none;
            background-color: #c7a16e;
            color: white;
            border-radius: 0 5px 5px 0;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- header start -->
    <header>
        <input type="checkbox" name="" id="toggler">
        <label for="toggler" class="fas fa-bars"></label>
        <a href="#" class="logo">Ventas<span>.</span></a>
        <nav class="navbar">
            <a href="#" id="reportesBtn">Reportes</a>
            <a href="./homeA.html">Volver</a>
        </nav>
    </header>
    <!-- header ends -->

    <!-- sales start -->
    <section class="sales" id="sales">
        <div class="container">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Busca el producto vendido, ejemplo: Lápiz 2H">
                <button><i class="fas fa-search"></i></button>
            </div>
            <table id="salesTable">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Valor total de la compra</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Agrega productos estáticos para prueba -->
                    <tr>
                        <td>Lápiz</td>
                        <td>2</td>
                        <td>3000</td> <!-- Precio: 1500 * Cantidad: 2 -->
                    </tr>
                    <tr>
                        <td>Cuaderno norma</td>
                        <td>1</td>
                        <td>2500</td> <!-- Precio: 2500 * Cantidad: 1 -->
                    </tr>
                    <tr>
                        <td>Pincel</td>
                        <td>3</td>
                        <td>3000</td> <!-- Precio: 1000 * Cantidad: 3 -->
                    </tr>
                    <tr>
                        <td>Tajalapiz</td>
                        <td>5</td>
                        <td>1000</td> <!-- Precio: 200 * Cantidad: 5 -->
                    </tr>
                </tbody>
            </table>
            <button id="endDayBtn">Terminar el día</button>
        </div>
    </section>
    <!-- sales ends -->

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const searchInput = document.getElementById('searchInput');
            const salesTableBody = document.getElementById('salesTable').getElementsByTagName('tbody')[0];
            const endDayBtn = document.getElementById('endDayBtn');

            // Función para actualizar la tabla de ventas
            const updateSalesTable = (sales) => {
                salesTableBody.innerHTML = ''; // Limpiar la tabla antes de actualizar
                sales.forEach(sale => {
                    const row = salesTableBody.insertRow();
                    row.insertCell(0).textContent = sale.productoNombre || 'Desconocido'; // Agregar manejo de errores
                    row.insertCell(1).textContent = sale.cantidad;
                    row.insertCell(2).textContent = sale.valorTotal;
                });
            }

            // Función para filtrar la tabla de ventas
            const filterSalesTable = () => {
                const query = searchInput.value.toLowerCase();
                const rows = salesTableBody.getElementsByTagName('tr');
                Array.from(rows).forEach(row => {
                    const cells = row.getElementsByTagName('td');
                    const productCell = cells[0].textContent.toLowerCase();
                    if (productCell.includes(query)) {
                        row.style.display = '';
                    } else {
                        row.style.display = 'none';
                    }
                });
            }

            // Evento para filtrar la tabla de ventas
            searchInput.addEventListener("input", filterSalesTable);

            // Evento para terminar el día
            endDayBtn.addEventListener("click", () => {
                alert("Día terminado. Implementa aquí la lógica para finalizar el día.");
                // Aquí puedes agregar la lógica para finalizar el día, como generar reportes o cerrar ventas.
            });
        });
    </script>
</body>
</html>

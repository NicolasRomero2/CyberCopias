<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Producto</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url(../img/FondoSimple.png) no-repeat;
            background-size: cover;
            background-position: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: #fff;
            padding: 10px 20px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .logo {
            font-size: 24px;
            color: #333;
            text-decoration: none;
        }
        .logo span {
            color: #c7a16e;
        }
        .navbar {
            display: flex;
        }
        .navbar a {
            text-decoration: none;
            color: #333;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .navbar a:hover {
            background-color: #c7a16e;
            color: #fff;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 90%;
            margin: 20px auto;
        }
        .add-product {
            background-color: #f9f9f9;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .add-product label {
            display: block;
            margin-bottom: 10px;
        }
        .add-product input, .add-product textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
        }
        .add-product input[type="submit"] {
            background-color: #c7a16e;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .add-product input[type="submit"]:hover {
            background-color: #a57e4e;
        }
        .product-info {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .product-info h3 {
            margin-top: 0;
        }
    </style>
</head>
<body>
<header>
    <a href="#" class="logo">Inventario<span>.</span></a>
    <nav class="navbar">
        <a href="./Inventario.html">Volver</a>
    </nav>
</header>
    <div class="container">
        <div class="add-product">
            <h2>Agregar Producto</h2>
            <form id="productForm" class="formulario__register">
                <label for="name">Nombre del producto:</label>
                <input type="text" id="name" name="name" required><br><br>
                <label for="description">Descripción del producto:</label>
                <textarea id="description" name="description" required></textarea><br><br>
                <label for="brand">Marca del producto:</label>
                <input type="text" id="brand" name="brand" required><br><br>
                <label for="price">Precio del producto:</label>
                <input type="number" id="price" name="price" required><br><br>
                <label for="stock">Stock del producto:</label>
                <input type="number" id="stock" name="stock" required><br><br>
                <label for="min_stock">Stock mínimo del producto:</label>
                <input type="number" id="min_stock" name="min_stock" required><br><br>
                <input type="submit" value="Agregar Producto">
            </form>
            <div id="productInfo" class="product-info">
                <h3>Información del Producto</h3>
                <p id="productDetails"></p>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const formRegister = document.querySelector("#productForm");  // Selecciona el formulario correcto para agregar productos
    
            // Función para registrar un nuevo producto
            const registerProduct = (e) => {
                e.preventDefault();  // Prevenir el comportamiento predeterminado del formulario
                const formData = new FormData(formRegister);
                const product = {
                    name: formData.get("Nombre"),
                    description: formData.get("Descripcion"),
                    brand: formData.get("Marca"),
                    price: formData.get("Precio"),
                    stock: formData.get("Stock"),
                    min_stock: formData.get("MinimoStock")
                };
    
                // Enviar los datos del producto al servidor mediante una solicitud POST
                fetch("http://localhost:5000/Producto", {  // Cambia la URL según tu endpoint
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(product)  // Convertir el objeto a JSON
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Error al guardar el producto en la base de datos");
                    }
                    return response.json();  // Procesar la respuesta como JSON
                })
                .then(data => {
                    console.log("Producto registrado en la base de datos:", data);
                    alert("Producto registrado con éxito");
                    
                    // Mostrar información del producto en el cuadro de información
                    const productDetails = document.querySelector("#productDetails");
                    productDetails.innerHTML = `
                        <strong>Nombre:</strong> ${data.Nombre}<br>
                        <strong>Descripción:</strong> ${data.Descripcion}<br>
                        <strong>Marca:</strong> ${data.Marca}<br>
                        <strong>Precio:</strong> ${data.Precio}<br>
                        <strong>Stock:</strong> ${data.Stock}<br>
                        <strong>Stock mínimo:</strong> ${data.MinimoStock}
                    `;
                    const productInfo = document.querySelector("#productInfo");
                    productInfo.style.display = "block";
    
                    formRegister.reset();
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("Error al guardar el producto en la base de datos.");
                });
            };
    
            // Agregar evento al formulario
            formRegister.addEventListener("submit", registerProduct);
        });
    </script>
    
</body>
</html>

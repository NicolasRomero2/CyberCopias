<!DOCTYPE html>
<html>
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Administrador</title>
    
        <!-- font awesome cdn link -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    
        <!-- custom css file link -->
        <link rel="stylesheet" href="../Assets/CSS/style.css">	
        <style>
            
        body {
            font-family: Arial, sans-serif;
            background: url(../img/FondoSimple.png) no-repeat;
            background-size: cover;
            background-position: center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 90%;
            height: 90%;
        }

        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

		.add-product {
			background-color: #f9f9f9;
			padding: 20px;
			border: 1px solid #ccc;
			border-radius: 10px;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
		}

		.add-product label {
			display: block;
			margin-bottom: 10px;
		}

		.add-product input, .add-product textarea {
			width: 100%;
			padding: 10px;
			margin-bottom: 20px;
			border: 1px solid #ccc;
		}

		.add-product input[type="submit"] {
			background-color: #c7a16e;
			color: #fff;
			padding: 10px 20px;
			border: none;
			border-radius: 10px;
			cursor: pointer;
		}

		.add-product input[type="submit"]:hover {
			background-color: #c7a16e;
		}
	</style>
</head>
<header>
    <input type="checkbox" name="" id="toggler">
    <label for="toggler" class="fas fa-bars"></label>
    <a href="#" class="logo">Inventario<span>.</span></a>
    <nav class="navbar">
        <a href="./homeA.html">Volver</a>
    </nav>
</header>
<body>
	<div class="container">
		<div class="add-product">
			<h2>Agregar Producto</h2>
			<form>
				<label for="name">Nombre del producto:</label>
				<input type="text" id="name" name="name"><br><br>
				<label for="description">Descripción del producto:</label>
				<textarea id="description" name="description"></textarea><br><br>
				<label for="brand">Marca del producto:</label>
				<input type="text" id="brand" name="brand"><br><br>
				<label for="price">Precio del producto:</label>
				<input type="number" id="price" name="price"><br><br>
				<label for="stock">Stock del producto:</label>
				<input type="number" id="stock" name="stock"><br><br>
				<input type="submit" value="Agregar Producto">
			</form>
		</div>
	</div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Módulo de Proveedores</title>
    <link rel="stylesheet" href="../Assets/CSS/style.css" />
    <style>
      body {
        font-family: Arial, sans-serif;
        background: url(../img/wall_page-0001.jpg) no-repeat;
        background-size: cover;
        background-position: center;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }
    
    header {
        background: #fff;
        padding: 10px 20px;
        border-bottom: 1px solid #ddd;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .container {
        width: 80%;
        margin: 150px auto 20px auto; /* Aumenté el margen superior a 150px para bajar más el contenedor */
        padding: 20px;
        background-color: #fff;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    
    h1 {
        text-align: center;
        margin-bottom: 20px;
    }
    
    h2 {
        margin-top: 30px;
        border-bottom: 2px solid #ddd;
        padding-bottom: 10px;
    }
    
    .form-group {
        margin-bottom: 15px;
    }
    
    label {
        display: block;
        margin-bottom: 5px;
    }
    
    input, select, textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 5px;
    }
    
    button {
        background-color: #c7a16e;
        color: #fff;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    
    button:hover {
        background-color: #a57e4e;
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }
    
    th, td {
        padding: 10px;
        border: 1px solid #ddd;
        text-align: left;
    }
    
    th {
        background-color: #f4f4f4;
    }
    
    tr:hover {
        background-color: #f9f9f9;
    }
    
    .form-container, .table-container {
        margin-bottom: 30px;
    }
    
    .modal {
        display: none;
        position: fixed;
        z-index: 1;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0, 0, 0, 0.4);
        padding-top: 60px;
    }
    
    .modal-content {
        background-color: #fefefe;
        margin: 5% auto;
        padding: 20px;
        border: 1px solid #888;
        width: 80%;
        max-width: 800px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    
    .close {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
    }
    
    .close:hover,
    .close:focus {
        color: black;
        text-decoration: none;
        cursor: pointer;
    }
    
    .modal-buttons {
        list-style-type: none;
        padding: 0;
        margin: 0;
        display: flex;
        justify-content: center;
        gap: 10px;
    }
    
    .modal-buttons li {
        margin: 0;
    }
    </style>
</head>
<body>
    <header>
        <a href="#" class="logo">Proveedores<span>.</span></a>
        <nav class="navbar">
            <a href="../View/homeA.html">Volver</a>
        </nav>
    </header>

    <div class="container">
        <h1>Gestión de Proveedores</h1>

        <!-- Botones para mostrar modales -->
        <div class="modal-buttons">
            <li><button id="showAddSupplierModal">Agregar Proveedor</button></li>
            <li><button id="showAddOrderModal">Agregar Pedido</button></li>
        </div>  

        <!-- Tabla de proveedores centrada -->
        <div class="table-container">
            <h2>Lista de Proveedores</h2>
            <table id="supplierTable">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Teléfono</th>
                        <th>Correo Electrónico</th>
                        <th>Dirección</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Aquí se agregarán dinámicamente los proveedores -->
                </tbody>
            </table>
        </div>

        <!-- Modal para agregar proveedor -->
        <div id="addSupplierModal" class="modal">
            <div class="modal-content">
                <span class="close" id="closeAddSupplierModal">&times;</span>
                <h2>Agregar Proveedor</h2>
                <form id="addSupplierForm">
                    <div class="form-group">
                        <label for="supplierName">Nombre del Proveedor</label>
                        <input type="text" id="supplierName" name="supplierName" required />
                    </div>
                    <div class="form-group">
                        <label for="phone">Teléfono</label>
                        <input type="tel" id="phone" name="phone" required />
                    </div>
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" required />
                    </div>
                    <div class="form-group">
                        <label for="address">Dirección</label>
                        <textarea id="address" name="address" required></textarea>
                    </div>
                    <button type="submit">Agregar Proveedor</button>
                </form>
            </div>
        </div>

        <!-- Modal para agregar pedido -->
        <div id="addOrderModal" class="modal">
            <div class="modal-content">
                <span class="close" id="closeAddOrderModal">&times;</span>
                <h2>Agregar Pedido</h2>
                <form id="addOrderForm">
                    <div class="form-group">
                        <label for="supplierOrder">Seleccionar Proveedor</label>
                        <select id="supplierOrder" name="supplierOrder" required>
                            <!-- Opciones dinámicas de proveedores -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="orderDate">Fecha del Pedido</label>
                        <input type="datetime-local" id="orderDate" name="orderDate" required />
                    </div>
                    <div class="form-group">
                        <label for="orderStatus">Estado del Pedido</label>
                        <select id="orderStatus" name="orderStatus" required>
                            <option value="Pendiente">Pendiente</option>
                            <option value="Recibido">Recibido</option>
                        </select>
                    </div>
                    <button type="submit">Agregar Pedido</button>
                </form>
            </div>
        </div>

        <!-- Tabla de pedidos -->
        <div class="table-container">
            <h2>Lista de Pedidos</h2>
            <table id="orderTable">
                <thead>
                    <tr>
                        <th>Proveedor</th>
                        <th>Fecha del Pedido</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Aquí se agregarán dinámicamente los pedidos -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="./Proovedor_ajax.js"></script>
</body>
</html>

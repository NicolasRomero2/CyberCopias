<!DOCTYPE html>
<html>
<head>
	<title>Compra y Carrito</title>
    <link rel="stylesheet" href="../Assets/CSS/style.css">

	<style>
		/* Estilos generales */
		body {
			font-family: Arial, sans-serif;
			margin: 20px;
		}
		
		/* Estilos de la página de compras */
		.compra {
			display: flex;
			flex-direction: column;
			align-items: center;
			padding: 20px;
			border: 1px solid #ddd;
			border-radius: 10px;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
		}
		
.compra img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 10px 10px 0 0;
  max-width: 300px; /* ajusta el ancho máximo de la imagen */
  max-height: 200px; /* ajusta la altura máxima de la imagen */
}
		
		.compra h2 {
			font-size: 24px;
			font-weight: bold;
			margin-bottom: 10px;
		}
		
		.compra p {
			font-size: 16px;
			margin-bottom: 20px;
		}
		
		.precio {
			font-size: 18px;
			font-weight: bold;
			color: #333;
			margin-bottom: 20px;
		}
		
		.btn-comprar, .btn-agregar-carrito {
			background-color: #333;
			color: #fff;
			border: none;
			padding: 10px 20px;
			font-size: 16px;
			cursor: pointer;
			margin-bottom: 10px;
		}
	</style>
</head>
<body>

    <header>    
    
        <nav class="navbar">
            <a href="./homeU.html">Volver</a>
        </nav>    
       
       </header>
	<!-- Página de compras -->
	<div class="compra">
		<img src="../img/prod-1.png" alt="Imagen del producto">
        <div>
            <h2>Nombre del producto</h2>
            <p>Descripcion del producto</p>
            <div class="precio">$12.99</div>
            <button class="btn-comprar">Comprar</button>
            <button class="btn-agregar-carrito">Agregar al carrito</button>
        </div>
	</div>
</body>
</html>
